name: address review

# Manual: dispatch when a maintainer leaves CHANGES_REQUESTED on a fork PR.
# Pushes the review text into a Jules session that branches off the existing
# PR head, applies the fixes, runs validation and pushes a new commit.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target id (e.g. nanocoder, tapflow)'
        required: true
      fork_owner:
        description: 'Fork owner (usually awhite0030)'
        required: true
        default: 'awhite0030'
      fork_pr_number:
        description: 'PR number on the FORK'
        required: true
      issue_number:
        description: 'Original upstream issue number this PR addresses'
        required: true
      review_file:
        description: 'Path (in repo) to file with reviewer feedback text'
        required: true

concurrency:
  group: address-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Dispatch Jules session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          . scripts/lib.sh
          load_config
          TARGET='${{ github.event.inputs.target }}'
          FORK_OWNER='${{ github.event.inputs.fork_owner }}'
          PR_NUM='${{ github.event.inputs.fork_pr_number }}'
          ISSUE_NUM='${{ github.event.inputs.issue_number }}'
          REVIEW_FILE='${{ github.event.inputs.review_file }}'

          UPSTREAM=$(cfg_target "$TARGET" upstream)
          pr_branch=$(gh api "repos/${FORK_OWNER}/${TARGET}/pulls/${PR_NUM}" --jq .head.ref)
          echo "target=$TARGET upstream=$UPSTREAM fork_pr=#$PR_NUM branch=$pr_branch"
          gh api -X POST "repos/${FORK_OWNER}/${TARGET}/merge-upstream" -F branch=main >/dev/null 2>&1 || true

          body_file=$(mktemp); prompt_file=$(mktemp); payload_file=$(mktemp)
          gh issue view -R "$UPSTREAM" "$ISSUE_NUM" --json body --jq '.body // ""' | head -c 4000 > "$body_file"

          {
            cat prompt_template_review.md
            printf '\n--- Reviewer feedback on PR #%s (branch %s) ---\n' "$PR_NUM" "$pr_branch"
            printf 'PR URL: https://github.com/%s/%s/pull/%s\n\n' "$UPSTREAM" "$TARGET" "$PR_NUM"
            cat "$REVIEW_FILE"
            printf '\n\n--- Issue #%s body (context) ---\n' "$ISSUE_NUM"
            cat "$body_file"
            printf '\n\n--- Validation commands (must pass before you finish) ---\n'
            cat "scripts/validate/${TARGET}.sh"
            printf '\n\n--- Repository rules ---\n'
            cat "rules/${TARGET}.md"
          } > "$prompt_file"

          jq -n \
            --rawfile prompt "$prompt_file" \
            --arg src "sources/github/${FORK_OWNER}/${TARGET}" \
            --arg title "Address review: ${TARGET}#${PR_NUM}" \
            --arg branch "$pr_branch" \
            '{
              prompt: $prompt,
              sourceContext: { source: $src, githubRepoContext: { startingBranch: $branch } },
              requirePlanApproval: false,
              automationMode: "AUTO_CREATE_PR",
              title: $title
            }' > "$payload_file"

          resp=$(jules_create_session "$payload_file")
          session_name=$(jq -r '.name // empty' <<<"$resp")
          if [ -z "$session_name" ]; then
            echo "ERROR: $(jq -r '.error.message // .' <<<"$resp")"
            exit 1
          fi
          sid=${session_name##*/}
          echo "session=$sid url=$(jq -r .url <<<"$resp")"
          rm -f "$body_file" "$prompt_file" "$payload_file"

      - name: Chain next loop
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: gh workflow run loop.yml --repo "$GITHUB_REPOSITORY" --ref main
